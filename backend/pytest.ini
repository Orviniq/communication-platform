[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py
asyncio_mode = auto
# The branch-coverage floor. Written here rather than as part of `--cov` itself,
# because a bare `pytest` has to stay the fast inner loop and a single test file
# measured against the whole tree would fail a floor it was never meant to meet.
# pytest-cov ignores this option when coverage is not running, so it costs a plain
# run nothing and binds every run that does measure: `pytest --cov --cov-branch`
# locally, and the same in CI.
#
# Ninety-eight from this release, raised from ninety-five against a measured 99.97
# percent. `backend/pyproject.toml` carries why that is the number and
# `docs/architecture/GROUND-TRUTH.md` carries the measurement.
#
# `--dist loadgroup` matters only when `-n` asks for workers; a bare `pytest` has none
# and stays serial, for the same inner-loop reason: each worker creates and migrates
# a test database of its own, which makes one small file 2.6 times slower under
# `-n auto` (0.96 s against 2.49 s). With workers, it keeps the race tests on one
# worker at a time, which is what holds a parallel run inside PostgreSQL's
# `max_connections`; `core/tests/workers.py` carries the measurement. The whole
# suite runs as `pytest -n auto --cov --cov-branch`, which is what CI runs.
addopts = --cov-fail-under=98 --dist loadgroup

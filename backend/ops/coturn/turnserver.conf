# coturn — the only media service of this deployment (ADR-0021).
#
# Voice is audio over SRTP between two client devices, keyed by DTLS between those
# two endpoints. This process relays packets it cannot open: it holds no DTLS key
# and no media key, and there is no application-level media key for it to hold.
# The client runs a relay-only ICE policy, so every media path crosses this relay
# and no peer ever learns another peer's address.
#
# Deployed to /etc/chat/turnserver.conf. Secrets and the realm live in the
# operator's env file (.env.example: TURN_REALM / TURN_STATIC_AUTH_SECRET), never
# in git. coturn cannot read environment variables from a config file, and a CLI
# flag would expose the secret in world-readable /proc/*/cmdline — so at deploy
# time copy this file to /etc/chat/turnserver.conf, owned root:turnserver mode
# 0640 (the same trust boundary as .env.production), and fill realm= and
# static-auth-secret= inline from those env values.

# Listen only on the VPS's own public interface — never a wildcard. One port, UDP
# and TCP; TCP is what carries a client on a network that drops UDP.
listening-ip=YOUR_VPS_IP
relay-ip=YOUR_VPS_IP
listening-port=3478

# No TLS listener of any kind. TURN-over-TLS and TURN-over-DTLS would encrypt the
# hop between a client and this relay, and that hop already carries SRTP the relay
# cannot open — so the listener would add a certificate, a private key and a
# renewal to a box whose whole posture is to hold neither. There is therefore no
# cert=, no pkey= and no tls-listening-port here.
no-tls
no-dtls

# Ephemeral HMAC credentials derived from the shared static secret: the username is
# a Unix expiry timestamp, a colon and a string of the backend's choosing, and the
# password is base64 of HMAC-SHA1 over that username under this secret. No per-user
# account state is ever stored here. `POST /api/v1/me/relay` is what mints one, and
# it signs under the same secret — the two copies are one value, filled from
# TURN_STATIC_AUTH_SECRET at deploy time.
use-auth-secret
# Filled at deploy time from the env file (see header); placeholders only in git:
#realm=chat.orviniq.com
#static-auth-secret=FILL_FROM_ENV_FILE

# Relay ports. One allocation takes one port, so this range has to be wider than
# `total-quota` below or the quota is not the binding limit — 1001 ports against a
# ceiling of 500 allocations.
min-port=50000
max-port=51000

# The quotas, sized from scale band 0: fewer than 50 accounts, at most 500 devices,
# at most ten participants in one room.
#
# `user-quota` bounds one credential, and the backend mints one per device. A full
# mesh of ten participants gives each device nine peer connections and therefore
# nine relay allocations; twenty leaves room for an ICE restart whose old
# allocations have not yet reached their lifetime.
#
# `total-quota` bounds the whole relay. Five simultaneous full rooms is 50 devices
# at nine allocations each, which is 450; 500 is that with a margin, and it is well
# inside the port range above.
user-quota=20
total-quota=500
# `user-quota` binds one credential, and under `use-auth-secret` a credential is
# whatever username the backend signed. `POST /api/v1/me/relay` signs a *random*
# username every call, so that a relay which sees a credential learns nothing about
# who holds it — which means each minted credential carries a `user-quota` of its
# own and `total-quota` is the bound that actually binds the host. What bounds one
# account is the `relay` throttle scope, 60 a minute, on the route that mints them.

# Relay only, and the smallest surface that leaves.
no-stun                    # answers no discovery STUN; a relay-only client needs none
no-cli                     # no telnet admin surface
no-rfc5780                 # no NAT-behaviour discovery
no-stun-backward-compatibility
fingerprint
no-multicast-peers
no-software-attribute      # do not advertise a version banner

# The peers a relay allocation may reach. Everything below is a range that names
# this host or the network it sits on rather than another participant, and a TURN
# server that will relay to them is an SSRF pivot into the loopback services of a
# shared VPS — PostgreSQL, Redis, uvicorn and the panel all listen there.
# coturn denies loopback peers unless --allow-loopback-peers is set, which is not
# set; the loopback ranges are written out anyway, because a posture that depends
# on a default is one nobody can read off the file.
# The host's own public address, filled with `listening-ip` above. Without it an
# allocation may name this box as its peer, which makes the relay an on-host proxy
# into nginx: the request arrives at 443 from the relay's own address, so the
# anonymous rate limiter — which keys on the address nginx forwards — counts it
# against the server rather than against the caller. That is AR-6's laundering
# problem reached from outside the host instead of from a neighbouring process.
denied-peer-ip=YOUR_VPS_IP
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
# NOT `denied-peer-ip=::`. coturn stores a single address as a range whose min and
# max are that address, and `ioa_addr_in_range` returns a match whenever the max is
# the all-zero "any" address — so `::` denies every peer of every family, IPv4
# included, and voice never connects. Measured against coturn 4.17.2 on 2026-09-05:
# with the line present a relay bind to an IPv4 peer was refused `403` and the relay
# logged `A peer IP 192.168.0.102 denied in the range: ::`; with it removed the same
# bind succeeded. The 4.6.1 the deployment installs carries the identical matcher.
# The unspecified address is not a peer anything can relay to, so nothing is lost.
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No log, on disk or in the journal. A TURN log line names the relay peer pair,
# which is two devices in one call — the same class of record as an access log, and
# invariant 4 refuses it at every layer. `simple-log` is what keeps coturn from
# turning the name below into a dated file of its own.
no-stdout-log
simple-log
log-file=/dev/null

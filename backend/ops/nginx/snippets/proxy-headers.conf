# ops/nginx/snippets/proxy-headers.conf — installed at /etc/nginx/snippets/.
#
# Every proxied location of chat.orviniq.com includes this file; `include`
# resolves against nginx's own prefix, which is why the path in the site file is
# `snippets/…` and not a path in this repository. The site adds
# `proxy_set_header X-Forwarded-Host $host` beside the include, because Django
# runs with USE_X_FORWARDED_HOST and that header must not survive from a client.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;

# `$remote_addr`, and deliberately not `$proxy_add_x_forwarded_for`: the latter
# keeps whatever list the client sent and appends the measured address, so the
# header that reaches uvicorn is mostly client-authored. uvicorn 0.52.4 reads the
# rightmost entry it does not trust, which is the appended one, so both forms
# happen to behave the same today — and that is the problem. Overwriting leaves
# one value in the header, the one nginx measured, so no future change to that
# selection rule can hand the anonymous rate limiter an address a caller chose.
# It does not close AR-6: a neighbouring process still reaches 127.0.0.1:8000
# directly and sets its own.
proxy_set_header X-Forwarded-For $remote_addr;

# What SECURE_PROXY_SSL_HEADER trusts. Pinned to the scheme nginx actually
# served, never passed through, or a plaintext request would present as https.
proxy_set_header X-Forwarded-Proto $scheme;

# One owner per header. nginx is the only layer that sees every response on this
# host — the proxied ones, the files it serves from disk, its own 404 and its own
# 413, 502 and 504 — so nginx emits HSTS for all of them, in the server block.
# Django's SecurityMiddleware sets it too, on the admin path it serves, and
# SECURE_HSTS_SECONDS has to stay set there because `check --deploy` requires it
# (security.W004) and because it is the correct value if this proxy is ever
# removed. `add_header` appends rather than replaces, so without this line an
# admin response would carry the header twice.
proxy_hide_header Strict-Transport-Security;

# Loopback. A connect that does not complete in five seconds is a dead upstream,
# not a slow one.
proxy_connect_timeout 5s;

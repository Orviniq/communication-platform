server {
    listen 80;
    listen [::]:80;
    server_name chat.nimashadloo.dev;
    # Both blocks, because both see a URI: this one carries whatever path a
    # plaintext request named, before the redirect sends it to the other.
    access_log off;
    error_log /var/log/nginx/chat-error.log crit;
    # Nothing here reads a body before the redirect, and a request that carries
    # one is answered 413 before it is read rather than redirected and re-sent.
    client_max_body_size 1k;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat.nimashadloo.dev;

    # Private-CA posture (ops/tls/README.md): the root is pre-distributed to client
    # devices and the clients SPKI-pin this key. The pair is installed out of band at
    # /etc/chat/tls/ and is never in this repository.
    ssl_certificate     /etc/chat/tls/server.crt;
    ssl_certificate_key /etc/chat/tls/server.key;
    ssl_protocols TLSv1.3;
    ssl_early_data off;                     # 0-RTT payloads are replayable

    # No resumption of any kind. A session ticket is encrypted under a key nginx
    # generates at startup and rotates only on reload, so it is a long-lived
    # symmetric secret sitting in worker memory that opens the resumption state of
    # every session it covers — on a box whose threat model grants the adversary
    # live root. `ssl_session_tickets` is on by default; `ssl_session_cache` is the
    # stateful half and its compiled default, `none`, still advertises resumption to
    # the client. `off` refuses it outright.
    #
    # What this costs is one full handshake per connection, and this deployment is
    # the one where that is nearly free: the client is a single Android application
    # that holds one long-lived WebSocket and makes a handful of requests beside it,
    # not a browser opening a connection per asset.
    ssl_session_tickets off;
    ssl_session_cache off;

    server_tokens off;

    # nginx owns this header for the whole host: it is the only layer that sees
    # every response — the proxied ones, the files served from disk, and nginx's
    # own 404, 413, 502 and 504. `snippets/proxy-headers.conf` hides the copy the
    # Django admin path sets, so exactly one reaches a client. `add_header` in a
    # location replaces every inherited one, so any location that adds a header of
    # its own repeats this line.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # The deny-by-default cap. Every location below states its own, equal to the
    # largest body that location admits; this one covers a path that matches no
    # location and is answered by nginx itself.
    client_max_body_size 1k;

    # The other half of uvicorn's --no-access-log, and load-bearing for the same
    # reason. nginx sees every request one hop earlier and inherits an access log
    # from the packaged nginx.conf unless a server block turns it off; the default
    # `combined` format writes $remote_addr and $request, which is the client
    # address and the whole URI. That URI carries the peer user UUID on the
    # key-claim and device routes, this operator-chosen admin path, and the bearer
    # capability that downloads an attachment. A request path on disk is the
    # conversation graph at rest that the schema exists to exclude.
    access_log off;
    # error_log writes the same line: an upstream failure is logged at `error`
    # with `client:` and `request:` fields, so a restarting worker would record
    # what the access log no longer does. `crit` is the level above that. Raising
    # it to debug an upstream is a deliberate, temporary act, and it puts request
    # paths on disk for as long as it lasts.
    error_log /var/log/nginx/chat-error.log crit;

    # This host serves an API, a WebSocket and the admin panel, nothing else.
    location = / {
        client_max_body_size 1k;            # answers 404; reads no body
        return 404;
    }

    # The admin panel. The path is operator-chosen: this location and ADMIN_PATH in
    # the environment file are one setting in two places and must be changed
    # together, or the panel answers this API's `not_found` envelope instead. Same
    # proxy settings as /api/ — the panel is served by the same uvicorn process,
    # with the Django application mounted behind FastAPI (ADR-0003).
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        include snippets/proxy-headers.conf;
        # Django runs with USE_X_FORWARDED_HOST; pin the header so a client-supplied
        # value can never reach it.
        proxy_set_header X-Forwarded-Host $host;
        # The admin claims no FastAPI route, so `api.app.route_limits` gives it the
        # fallback class: BODY_CAP_JSON_BYTES of body and REQUEST_DEADLINE_SECONDS
        # of time. 16k is that cap. The panel posts a login form, a change form and
        # a changelist action carrying the selected primary keys, and the largest of
        # those is a few kilobytes; a body above 16k is refused by the application
        # anyway, and refusing it here means it is never carried to loopback.
        client_max_body_size 16k;
        # Above the application's own 15 s deadline, so a slow request is answered
        # by the deadline's `503 unavailable` envelope rather than cut into a 504.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        include snippets/proxy-headers.conf;
        # Django runs with USE_X_FORWARDED_HOST; pin the header so a client-supplied
        # value can never reach it.
        proxy_set_header X-Forwarded-Host $host;
        # The largest body any route of this API admits: BODY_CAP_BATCH_BYTES,
        # 73400320 bytes exactly, which the `devices` and `messaging` list routes
        # take. The attachment upload is smaller — the 64 MiB bucket plus
        # MULTIPART_OVERHEAD_BYTES — and every other route is 2 MiB or 16 KiB.
        # Raising either side alone breaks the pair: nginx would 413 a body the
        # application admits, or carry one it refuses.
        client_max_body_size 70m;
        # Stated rather than inherited, because the whole timeout argument below
        # rests on it. With buffering on, nginx reads the entire body before it
        # opens the loopback connection, so the application's deadline covers the
        # loopback hop alone and never the client's link. Measured against nginx
        # 1.31.2 with a 200 KiB body trickled over 5 s: on, the upstream saw the
        # request headers at 5.07 s and read the body in the same instant; off, it
        # saw them at 1.55 s and spent the next 3.5 s reading, inside its own
        # deadline. This is nginx's default, and a release or an operator that
        # turned it off would move a slow client's whole upload into the
        # application's 120 s with nothing here to say that was wrong.
        proxy_request_buffering on;
        # The other half of the same pair: nginx now owns the body read, so the
        # bound on a stalled client is here and nowhere else. It is the gap
        # between two successive reads and not the total — a live slow link
        # trickles and never approaches it, while a client that opens a
        # connection, declares 64 MiB and then stops costs 30 s of a worker slot
        # rather than nginx's default 60. The total is bounded by
        # `client_max_body_size` above: a body cannot outlast the bytes it is
        # allowed to send.
        client_body_timeout 30s;
        # Innermost first: the application's own deadline is 120 s on the upload
        # and batch routes (UPLOAD_DEADLINE_SECONDS), so nginx must wait longer
        # than that or a slow upload becomes a 504 with no application answer.
        # nginx's default of 60 s is below it and would invert the order.
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        include snippets/proxy-headers.conf;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A handshake is a GET and carries no body; frames after the upgrade are
        # bounded by WS_MAX_FRAME in the application and not by this directive.
        # 1k is the smallest positive cap — 0 would disable the check entirely.
        client_max_body_size 1k;
        # A live socket is idle between frames. uvicorn pings every 20 s, so an
        # hour is far above any real gap and still bounds a dead peer.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        alias /srv/chat/backend/static_root/;
        client_max_body_size 1k;            # GET only; reads no body
        # nginx is the sole owner of every header on this location: the panel's
        # CSS, JavaScript and fonts are served from disk and no application sees
        # the request. `add_header` replaces the inherited set, so HSTS is
        # repeated. `nosniff` because a panel asset re-interpreted as another type
        # is script execution in the operator's session.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Attachment bytes: Django authorizes, nginx serves from an internal location.
    # No add_header here: an X-Accel-Redirect response keeps the headers the
    # application set — `Cache-Control: private, no-store` — and inherits HSTS from
    # the server block, so adding a set here would replace that inheritance. The
    # location is `internal`, so nothing reaches it but a redirect from a request
    # this API already authorized.
    location /_protected_attachments/ {
        internal;
        alias /srv/chat/backend/media_root/;
        client_max_body_size 1k;            # reached by internal redirect of a GET
    }
}

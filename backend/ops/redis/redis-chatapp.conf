# Redis for the chat backend: loopback only and deliberately non-persistent, so
# volatile state (the fan-out bus, the throttle counters, the login lockout) never
# touches disk.
bind 127.0.0.1
protected-mode yes
save ""
appendonly no

# The host is 1 vCPU and 1 GB, shared with PostgreSQL, nginx and coturn, and one
# uvicorn worker already holds around 200 MB of it
# (`docs/architecture/GROUND-TRUTH.md` §1 and §4). Unbounded, Redis grows until the
# kernel picks a victim, and the victim may be PostgreSQL. Everything this instance
# holds is small and carries a TTL — the throttle counters, the login lockout and
# the day's upload allowance — and the fan-out bus stores nothing at all, so 128 MB
# is far above the working set and is a bound rather than a budget.
maxmemory 128mb

# `noeviction`, and not one of the eviction policies. Every key here is a security
# control: an evicted throttle counter is a rate limit that silently resets, and an
# evicted lockout key is a password-guessing bound that silently resets. Refusing
# the write is the fail-closed posture ADR-0010 already takes on this store — the
# limiter turns a store that refuses into `503 unavailable`, which is loud, rather
# than into an allowance nobody knows was given back.
maxmemory-policy noeviction

# On the shared VPS, loopback is reachable by every local service, and an
# unauthenticated Redis would let any compromised neighbour flush the rate
# counters and the login lockout, and publish frames on the fan-out bus. At deploy
# time, uncomment and fill from the same generator as the other secrets, then carry
# the password in REDIS_URL
# (redis://:<password>@127.0.0.1:6379/0) in .env.production: `manage.py check
# --deploy` refuses a REDIS_URL that carries none (core.E004), so a deployment
# cannot forget this line. Left commented for single-user development machines.
#requirepass FILL_AT_DEPLOY

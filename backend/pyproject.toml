# Ruff is the only linter and formatter for this project. No type checker is added.
#
# The rule set is deliberately small: every violation it reports has a mechanical
# fix, so a lint failure never turns into a design argument. `vendor/` and `.venv/`
# are ignored through `.gitignore`, which ruff honours by default.

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
# E, W  pycodestyle    — layout errors and warnings
# F     pyflakes       — unused imports, undefined names, dead bindings
# I     isort          — import order
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "api",
    "attachments",
    "config",
    "core",
    "devices",
    "messaging",
    "ops",
    "realtime",
    "vault",
]

[tool.ruff.lint.per-file-ignores]
# The Django ASGI application has to be built — and so the app registry populated —
# before any router is imported, because every router reads a model. The import order
# is load-bearing.
"config/asgi.py" = ["E402"]
# The settings modules layer over `base` with a star import, which is how Django
# settings compose; the names a layer overrides come from that star. `dev` also sets
# its two fallback secrets above that import, because `base` reads both while it runs.
"config/settings/dev.py" = ["E402", "F403", "F405"]
"config/settings/prod.py" = ["F403", "F405"]
# `makemigrations` writes these files, and the long lines in them are Django's own
# field help texts. Nobody chooses that width, and a rewrap here is lost the next
# time the migration is regenerated.
"*/migrations/*.py" = ["E501"]

# Coverage is measured with branch coverage, and the floor that turns the figure
# into a gate is `--cov-fail-under=98` in `pytest.ini` and in the CI test job.
# Ninety-eight rather than the figure the suite happens to reach: measured at 99.97
# percent — 3033 statements with none missed, 442 branches with one partial — a floor
# set at the measurement fails on the next honest refactor, and one set a whole point
# below it says what the project will not go under. It was ninety-five until this
# release, which is three points of slack the suite has never used.
#
# `source` is the repository, not a list of apps, so a new app is measured the day
# it is created rather than the day somebody remembers to add it here. The two
# omitted trees are not project code: `.venv/` is the installed toolchain and
# `vendor/` is the untracked wheel cache of ADR-0012.
[tool.coverage.run]
branch = true
source = ["."]
omit = [
    ".venv/*",
    "vendor/*",
    # Generated by `makemigrations`; the migration suite drives them end to end
    # rather than importing them for line credit.
    "*/migrations/*",
    # The suite does not measure itself.
    "*/tests/*",
    # A four-line Django entry point, and a developer tool that writes the golden
    # vectors the suite then checks in.
    "manage.py",
    "devices/vectors/generate.py",
]

[tool.coverage.report]
precision = 1
show_missing = true

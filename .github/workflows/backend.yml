name: backend

# Every push, and every pull request that targets main. The five jobs are
# independent: a lint failure must not hide a test failure, a failing test must
# not hide a failing deploy check, and the offline install is the one gate that
# proves the no-foreign-dependency rule still holds.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install the pinned toolchain
        run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  schema:
    name: schema
    runs-on: ubuntu-latest
    # No service container: composing the application and generating the
    # document opens neither PostgreSQL nor Redis, so the drift gate needs the
    # settings and nothing else.
    env:
      # Test-only values, read at import time by config.settings.dev. Nothing
      # here is a production credential and nothing here reaches a deployed host.
      DJANGO_SECRET_KEY: ci-test-secret-not-used-outside-this-runner
      JWT_SIGNING_KEY: ci-test-jwt-key-not-used-outside-this-runner
      POSTGRES_DB: chatapp
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install the pinned toolchain
        run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: The committed document is the one this code generates
        # Exits non-zero on drift. The artefact is what a client generates
        # from, so a contract change that forgets it fails here rather than in
        # a client built against a document the server no longer serves.
        run: python manage.py openapi --check

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chatapp
          POSTGRES_USER: chatapp
          POSTGRES_PASSWORD: chatapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatapp -d chatapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values. The suite runs under config.settings.dev, which reads
      # both keys from the environment at import time; nothing here is a
      # production credential and nothing here reaches a deployed host.
      DJANGO_SECRET_KEY: ci-test-secret-not-used-outside-this-runner
      JWT_SIGNING_KEY: ci-test-jwt-key-not-used-outside-this-runner
      POSTGRES_DB: chatapp
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install the pinned toolchain
        run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: pytest
        # pytest-randomly reorders every run and prints the seed it used, so a
        # failure that depends on test order is reproducible from the log.
        #
        # Measured, and gated: `--cov-fail-under` is what makes a branch the
        # suite stopped covering a failed build rather than a number in a report
        # nobody reads. It repeats `pytest.ini`'s floor on purpose, so the job
        # states the contract it enforces instead of inheriting it silently.
        run: pytest --cov --cov-branch --cov-fail-under=98
      - name: No model change is missing its migration
        run: python manage.py makemigrations --check --dry-run

  deploy-check:
    name: deploy-check
    runs-on: ubuntu-latest
    # A job of its own, and not a step after pytest: a failing test would
    # otherwise end the job before the deploy gate ever ran, which is the same
    # rule the jobs above already follow. It needs no service container —
    # `check --deploy` opens neither PostgreSQL nor Redis.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install the pinned toolchain
        run: python -m pip install --require-hashes -r requirements/dev.txt
      - name: Deploy checks against the production settings
        # The stub is the deployment's shape, not a minimum that passes:
        # REDIS_URL carries a password because `core.E004` refuses one that does
        # not. Every secret is generated inside the step and exists only for its
        # length — a literal would drift into a real value's place and would not
        # exercise security.W009's strength test honestly.
        # Assumption A7 of the design record owns the gap this stub leaves.
        #
        # --fail-level WARNING is what makes this a gate: without it the command
        # prints its findings and exits 0, and a `core.E`, a `core.W` or any of
        # Django's own `security.W###` would reach a release as a note in a log.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: ci.invalid
          POSTGRES_DB: chatapp
          POSTGRES_USER: chatapp
        run: |
          generate() { python -c 'import secrets; print(secrets.token_urlsafe(64))'; }
          export DJANGO_SECRET_KEY="$(generate)"
          export JWT_SIGNING_KEY="$(generate)"
          export POSTGRES_PASSWORD="$(generate)"
          export REDIS_URL="redis://:$(generate)@127.0.0.1:6379/0"
          # The relay stub is the configured shape, not the off one: with
          # TURN_URLS empty `core.E005` would never weigh the relay secret, so
          # the gate would pass over the branch a serving deployment runs.
          export TURN_URLS="turn:ci.invalid:3478?transport=udp"
          export TURN_STATIC_AUTH_SECRET="$(generate)"
          python manage.py check --deploy --fail-level WARNING

  offline-install:
    name: offline-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The runner is the platform the VPS installs on
        # The wheel set this job proves is per-platform, so the claim is only
        # about Linux x86-64 if the runner is one. `ubuntu-latest` is x86-64
        # today; an arm64 runner would make this job pass over a different set
        # of wheels than the VPS installs, and say nothing about the VPS.
        run: |
          test "$(uname -s)-$(uname -m)" = "Linux-x86_64" \
            || { echo "unexpected runner: $(uname -s)-$(uname -m)"; exit 1; }
      - name: Collect every dependency as a hash-verified wheel
        # --only-binary=:all: refuses a source distribution, because the VPS has
        # no compiler and no network when it installs. This is the same set that
        # ops/vendor.sh produces on the VPS while it is still online.
        run: |
          python -m pip download \
            --require-hashes --only-binary=:all: \
            -r requirements/dev.txt -d "$RUNNER_TEMP/wheels"
          echo "wheels collected: $(find "$RUNNER_TEMP/wheels" -name '*.whl' | wc -l)"
      - name: Install from those wheels with the network index disabled
        # --no-index is the whole point: pip may not reach any package index. A
        # dependency that is not in the directory fails here instead of on a VPS
        # during a shutdown.
        run: |
          python -m venv "$RUNNER_TEMP/offline"
          "$RUNNER_TEMP/offline/bin/pip" install \
            --no-index --find-links "$RUNNER_TEMP/wheels" \
            --require-hashes -r requirements/dev.txt
      - name: The offline tree imports
        run: |
          "$RUNNER_TEMP/offline/bin/python" -c "
          import django, fastapi, multipart, psycopg, psycopg_pool, pydantic, redis
          print('django', django.get_version(), 'fastapi', fastapi.__version__)
          "

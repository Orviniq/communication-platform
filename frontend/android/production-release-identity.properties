# Production release identity (ADR-076 D2).
#
# Every value here is PUBLIC. This file holds no key material and no password.
# ADR-076 makes it the one source that the production build reads and that
# `tool/verify_release_apk.sh` verifies produced artifacts against, so the built
# identity and the verified identity cannot drift apart.
#
# WARNING - both values freeze at the first install on any device.
#
# Android accepts an update only when the application ID and the signing
# certificate both match the installed app. Changing either one turns every
# later release into a different application: the OS refuses the update, and the
# only way forward is uninstall plus reinstall.
#
# For this app that is unrecoverable. Uninstalling erases all app data, which
# here means both the SQLCipher database and storage_key_v1.bin, the envelope
# holding its key, and the manifest sets allowBackup="false" so nothing restores
# either. The database key exists nowhere else: it is wrapped by a
# non-exportable AndroidKeyStore key, so there is no exportable copy to keep.
# Local message history has no server-side copy by design.
#
# Until the first install either value can still change without harming any
# install. From then on, do not edit either one. See ADR-076 in
# docs/decisions.md.

# Production application ID, permanent by the owner's answer to ADR-076's first
# question. The development flavor is this value plus ".development", a separate
# application that coexists with it on a device.
application.id=com.orviniq.chat

# SHA-256 digest of the production signing certificate, lower-case hex, no
# colons, as `apksigner verify --print-certs` reports it.
#
# Empty means no production signing identity has been created yet. Populate it
# once, with `tool/create_production_keystore.sh`, and never change it again.
# Under ADR-076 D6 no signed artifact passes verification while it is empty:
# nothing is released until the identity it must match is recorded here.
signing.certificate.sha256=

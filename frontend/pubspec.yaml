name: communication_platform
description: "Android client for Communication Platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.2 <3.13.0'
  flutter: 3.44.7

# Every direct dependency is pinned to one exact version, never a range: the
# resolved set is the reviewed set, `pubspec.lock` records it, and CI resolves
# with `--enforce-lockfile` so a drifted pin fails rather than installs. See
# ADR-054 for what each of these was chosen over, and what must be
# re-established before any of them moves.
dependencies:
  connectivity_plus: 6.0.5
  dio: 5.11.0
  drift: 2.34.2
  drift_flutter: 0.3.1
  emoji_picker_flutter: 4.5.3
  ffi: 2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.2
  forui: 0.24.3
  go_router: 17.3.0
  intl: 0.20.2
  qr_flutter: 4.1.0
  sqlite3: 3.5.0
  web_socket_channel: 3.0.3

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  default-flavor: development
  generate: true
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Variable.ttf
